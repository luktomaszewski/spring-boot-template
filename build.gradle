plugins {
    id "java"
    id "org.springframework.boot" version "3.5.3"
    id "io.spring.dependency-management" version "1.1.7"
    id "jacoco"
    id "org.owasp.dependencycheck" version "12.1.0"
    id "com.diffplug.spotless" version "7.0.1"
}

ext {
    archUnitVersion = "1.4.1"
    jacocoVersion = "0.8.13"
    liquibaseVersion = "4.32.0"
    lombokVersion = "1.18.38"
    mockitoVersion = "5.18.0"
    swaggerVersion = "2.8.9"
    h2Version = "2.3.232"
}

group = "com.github.lomasz.spring.boot.template"
version = "0.0.1-SNAPSHOT"

java {
    setSourceCompatibility(JavaVersion.VERSION_24)
    setTargetCompatibility(JavaVersion.VERSION_24)
}

repositories {
    mavenCentral()
    maven { url = "https://oss.jfrog.org/artifactory/oss-snapshot-local/" }
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter"

    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-data-rest"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-actuator"

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:$swaggerVersion"

    implementation "org.liquibase:liquibase-core:$liquibaseVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    runtimeOnly "com.h2database:h2:$h2Version"

    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webflux"
    testImplementation "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testImplementation "com.tngtech.archunit:archunit-junit5:$archUnitVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"
}

processResources {
    expand(project.properties)
}

clean {
    delete "out"
}

dependencyCheck {
    failBuildOnCVSS = 7
    format = "HTML"
    autoUpdate = true

    nvd {
        apiKey = System.getenv("NVD_API_KEY") ?: ""
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        //palantirJavaFormat()
        leadingTabsToSpaces(4)
    }
}

jacoco {
    toolVersion = "$jacocoVersion"
}

jacocoTestReport {
    reports {
        xml.required = true
    }
    executionData(fileTree(layout.buildDirectory.get().asFile).include("jacoco/*.exec"))
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it,
                    exclude: ["**/*Application*",
                              "**/config/**/*",
                              "**/exception/**/*",
                              "**/model/**/*"])
        }))
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()

    finalizedBy tasks.jacocoTestReport

    testLogging {
        events "passed", "skipped", "failed"
    }
}
